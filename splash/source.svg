<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="title description">
    <title id="title">Holy Furries Studio</title>
    <desc id="description">A fox glances up as its halo drops, bounces, and settles crooked. The studio name follows.</desc>
    <style>
        :root { color-scheme: dark; background: oklch(28.3468% 0.01742 141.66); }
        .fox { transform-origin: 101px 126px; animation: appear 255ms linear both; }
        .face { transform-origin: 101px 126px; animation: face 675ms linear both; }
        .halo { transform-origin: 104px 27px; animation: halo 870ms linear both; }
        .eyes { transform-origin: 101px 130px; animation: glance 1065ms ease-in-out both; }
        .wordmark { animation: wordmark 1125ms ease-out both; }
        .subtitle { animation: subtitle 1185ms ease-out both; }
        @keyframes appear {
            0% { transform: translateY(12px) scale(0); animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
            64.706% { transform: translateY(0) scale(1.04); }
            100% { transform: none; }
        }
        @keyframes face {
            0%, 64.444% { transform: none; }
            73.333% { transform: translateY(5px) scale(1.07, 0.91); }
            84.444% { transform: scale(0.98, 1.04); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
            100% { transform: none; }
        }
        @keyframes halo {
            0%, 20.69% { transform: translateY(-105px) rotate(16deg); visibility: hidden; }
            22.414% { transform: translateY(-105px) rotate(16deg); visibility: visible; animation-timing-function: cubic-bezier(0.55, 0, 0.95, 0.6); }
            55.172% { transform: translateY(5px) rotate(9deg); animation-timing-function: cubic-bezier(0.15, 0.6, 0.3, 1); }
            70.69% { transform: translateY(-12px) rotate(-9deg); animation-timing-function: ease-in; }
            84.483% { transform: translateY(2px) rotate(4deg); animation-timing-function: ease-out; }
            100% { transform: none; }
        }
        @keyframes glance {
            0%, 38.028% { transform: none; }
            53.521%, 74.648% { transform: translateY(-4px); }
            85.915% { transform: none; }
            92.958% { transform: scaleY(0.12); }
            100% { transform: none; }
        }
        @keyframes wordmark {
            0%, 78.667% { clip-path: inset(0 100% 0 0); transform: translateY(5px); }
            100% { clip-path: inset(0 0 0 0); transform: none; }
        }
        @keyframes subtitle {
            0%, 86.076% { visibility: hidden; letter-spacing: 8px; }
            87.342% { visibility: visible; letter-spacing: 8px; }
            100% { visibility: visible; letter-spacing: 5px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .fox, .face, .halo, .eyes, .wordmark, .subtitle { animation: none; }
        }
    </style>
    <g transform="translate(140 40)" fill="none" stroke="oklch(59.3787% 0.19001 30.842)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <g class="halo">
            <ellipse cx="104" cy="27" rx="43" ry="12" transform="rotate(-12 104 27)"/>
        </g>
        <g class="fox">
            <g class="face">
                <path fill="oklch(59.3787% 0.19001 30.842)" d="M31 56 82 86 119 86 171 53 157 125 101 177 45 126Z"/>
                <path stroke="oklch(95.4987% 0.01238 91.519)" d="m54 81 6 27 20-7m67-23-7 29-18-6"/>
            </g>
            <path class="eyes" stroke="oklch(95.4987% 0.01238 91.519)" d="M64 127l22 8m49-9-21 9"/>
            <path class="nose" fill="oklch(95.4987% 0.01238 91.519)" stroke="oklch(95.4987% 0.01238 91.519)" d="m92 151 9 8 9-8Z"/>
        </g>
    </g>
    <g fill="oklch(95.4987% 0.01238 91.519)" text-anchor="middle">
        <g class="wordmark">
            <text x="240" y="293" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="-2.76">holy furries</text>
        </g>
        <text class="subtitle" x="242.5" y="334" font-family="Courier New, monospace" font-size="14" letter-spacing="5">STUDIO</text>
    </g>
</svg>
